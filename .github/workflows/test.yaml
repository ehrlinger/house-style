# The composer is load-bearing for nine repositories: each pins this repo at
# house-style-v1 and runs its drift check against these sources. A break here
# reddens all of them, so the suite gates every change.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: install.packages(c("yaml", "digest", "testthat", "withr"))
        shell: Rscript {0}

      # test-mirror.R compares sources/ against the Obsidian vault and
      # skip_if_not()s when the vault is absent -- which is always, on a
      # runner. That skip is by design: it is a human-with-the-vault check.
      # Every other test runs and gates the job, including the MANIFEST
      # check, which pins the mirror's bytes without needing the vault.
      - name: Run the suite
        run: Rscript tests/testthat.R

      # A skip renders as a bare 'S' in the summary reporter, one character
      # away from a pass. That made a green job read as "the mirror is fine"
      # when it meant "the mirror was not checked" -- see #8, where the
      # resulting drift surfaced in a downstream repo instead of here.
      #
      # This annotates rather than fails on purpose. Failing would redden
      # every push forever, since a runner can never have the vault, and a
      # permanently red check is ignored within a week. The blocking gate
      # for this lives at the tag move (bin/move-tag.sh), which is the step
      # that actually propagates drift and does run on a machine with the
      # vault.
      - name: Report what the mirror check could not verify
        if: always()
        run: |
          if [ -d "$HOME/Documents/ObsidianVault/memory" ]; then
            echo "Vault present: sources/ was verified against it."
          else
            echo "::warning title=Mirror not verified against the vault::sources/ is byte-pinned by sources/MANIFEST, but nothing here compared it to the vault -- no runner has one. Vault freshness is gated at the tag move by bin/move-tag.sh."
            {
              echo "### Mirror freshness: **not verified**"
              echo
              echo "\`sources/\` matches \`sources/MANIFEST\`, so no hand edit slipped in."
              echo "Whether \`sources/\` still matches the vault is *unknown to this job*."
              echo "That check runs in \`bin/move-tag.sh\` before \`house-style-v1\` moves."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # End-to-end smoke test of the CLI, which the unit suite does not cover:
      # it exercises the installed dependencies and the actual entry point.
      #
      # It composes into a throwaway repo via a throwaway registry, because
      # repos.yml holds absolute machine-local paths and none of them exist on
      # a runner. Then it tampers with the artifact and requires the drift
      # check to catch it -- so the step fails if composition breaks, if the
      # artifact is empty or malformed, or if drift detection stops working.
      - name: Smoke test the CLI end to end
        run: |
          set -e
          tmp=$(mktemp -d)
          mkdir -p "$tmp/fakerepo"
          cat > "$tmp/registry.yml" <<YML
          repos:
            - name: smoketest
              path: $tmp/fakerepo
              profile: package-internal
              default_persona: a
              secondary_personas: [c]
          YML
          cp "$tmp/registry.yml" repos.yml

          Rscript compose-house-style.R --repo smoketest --vault sources
          Rscript compose-house-style.R --check --repo smoketest --vault sources

          test -s "$tmp/fakerepo/.claude/house-style.md"
          grep -q 'GENERATED FILE' "$tmp/fakerepo/.claude/house-style.md"

          # Drift must be detected, and specifically as exit 2. Asserting only
          # "non-zero" would pass if --check failed for an unrelated reason --
          # exit 1 covers usage errors and missing sources -- so a broken drift
          # check masked by any other error would slip through.
          printf '\nhand edit\n' >> "$tmp/fakerepo/.claude/house-style.md"
          set +e
          Rscript compose-house-style.R --check --repo smoketest --vault sources
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "::error::expected exit 2 (drift detected), got $rc -- 1 means the CLI errored for another reason, 0 means drift went unnoticed"
            exit 1
          fi

          git checkout -- repos.yml
